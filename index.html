<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1F67FE" id="themeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="对账本">
  <title>对账本 · 个人对账</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{
      --blue:#8ab4ff; --blue-d:#6f9bf5; --bg:#eef4ff; --card:rgba(255,255,255,.78);
      --text:#3a3550; --sub:#9b94b0; --line:rgba(255,255,255,.4);
      --in:#5ec98a; --out:#ff8fa3;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;height:100%;}
    body{
      font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text); background:var(--bg); background-attachment:fixed;
      -webkit-font-smoothing:antialiased;
    }
    body.has-wallpaper{
      background-size:cover !important; background-position:center !important;
      background-repeat:no-repeat !important; background-attachment:fixed !important;
    }
    .app{max-width:480px;margin:0 auto;min-height:100%;position:relative;padding-bottom:86px;}
    /* 顶部 header */
    .topbar{
      position:sticky; top:0; z-index:20;
      padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
      display:flex; align-items:flex-start; justify-content:space-between;
      color:#fff;
    }
    .topbar .left{}
    .topbar .skin-title{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.25);}
    .topbar .skin-sub{margin-top:3px; font-size:12px; opacity:.92; text-shadow:0 1px 2px rgba(0,0,0,.2);}
    .topbar .avatar{
      width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.6);
      background:rgba(255,255,255,.25) url('data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"white\"><path d=\"M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\"/></svg>') center/60% no-repeat;
      overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.15);
    }
    .topbar .avatar img{width:100%;height:100%;object-fit:cover;}

    /* 视图 */
    .view{display:none; padding:0 16px 16px;}
    .view.active{display:block;}

    /* 首页 */
    .home-card{
      background:var(--card); border-radius:28px; padding:24px 20px;
      box-shadow:0 10px 36px rgba(138,180,255,.18); backdrop-filter:blur(12px);
      margin-bottom:16px;
    }
    .home-card .bal-row{display:flex; align-items:flex-end; justify-content:space-between;}
    .home-card .bal-label{font-size:13px; color:var(--sub);}
    .home-card .bal-num{font-size:38px; font-weight:800; margin-top:4px; letter-spacing:-.5px; color:var(--text);}
    .home-card .count{font-size:13px; color:var(--sub); text-align:right;}
    .home-card .count b{font-size:18px; color:var(--text);}
    .home-card .io-row{display:flex; gap:10px; margin-top:18px;}
    .home-card .io-box{flex:1; background:rgba(255,255,255,.6); border-radius:18px; padding:14px;}
    .home-card .io-box .k{font-size:12px; color:var(--sub);}
    .home-card .io-box .v{font-size:19px; font-weight:700; margin-top:3px;}
    .home-card .io-box .v.in{color:var(--in);}
    .home-card .io-box .v.out{color:var(--out);}
    .sec-title{display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:700; margin:18px 4px 10px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.2);}
    .sec-title .more{font-size:12px; font-weight:500; opacity:.9;}

    /* 明细 */
    .day-group{margin-bottom:14px;}
    .day-head{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; font-size:13px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.2);}
    .day-head .tag{background:rgba(0,0,0,.12); padding:2px 8px; border-radius:10px; font-size:11px; margin-left:8px;}
    .rec-item{
      background:var(--card); border-radius:20px; padding:14px 15px; margin-bottom:10px;
      display:flex; align-items:center; gap:12px; box-shadow:0 4px 16px rgba(138,180,255,.12);
      backdrop-filter:blur(10px);
    }
    .rec-item .icon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
    .rec-item .mid{flex:1;min-width:0;}
    .rec-item .t{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rec-item .s{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rec-item .amt{font-size:17px;font-weight:700;white-space:nowrap;}
    .rec-item .amt.in{color:var(--in);} .rec-item .amt.out{color:var(--out);}

    /* 统计 */
    .stat-head{display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 16px; color:#fff; font-size:17px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.2);}
    .stat-head button{background:rgba(255,255,255,.2); border:none; color:#fff; width:28px; height:28px; border-radius:50%; font-size:14px;}
    .stat-cards{display:flex; gap:10px; margin-bottom:16px;}
    .stat-cards .sc{flex:1; background:var(--card); border-radius:18px; padding:14px 10px; text-align:center; backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .stat-cards .sc .k{font-size:12px; color:var(--sub);}
    .stat-cards .sc .v{font-size:18px; font-weight:800; margin-top:4px;}
    .stat-cards .sc.in .v{color:var(--in);} .stat-cards .sc.out .v{color:var(--out);}
    .chart-card{background:var(--card); border-radius:24px; padding:16px; margin-bottom:14px; backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .chart-card h4{margin:0 0 12px; font-size:14px; color:var(--sub); font-weight:600;}
    .chart-card canvas{width:100%; height:200px;}

    /* 我的 */
    .mine-card{background:var(--card); border-radius:24px; padding:18px; margin-bottom:14px; backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(0,0,0,.06);}
    .mine-card h4{margin:0 0 12px; font-size:15px; font-weight:700;}
    .theme-row{display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;}
    .theme-item{flex-shrink:0; width:80px; text-align:center; cursor:pointer;}
    .theme-item .circle{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;border:3px solid transparent;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;font-size:22px;}
    .theme-item.on .circle{border-color:var(--text);}
    .theme-item .name{font-size:12px; color:var(--sub);}
    .upload-row{display:flex; gap:10px; margin-top:10px;}
    .upload-row label{flex:1; display:block; background:rgba(255,255,255,.5); border-radius:12px; padding:12px; text-align:center; font-size:13px; color:var(--sub); cursor:pointer; border:1px dashed var(--line);}
    .upload-row input{display:none;}
    .preview-img{width:100%; max-height:120px; object-fit:cover; border-radius:12px; margin-top:10px; display:none;}

    /* 底部 tab */
    .tabbar{
      position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 8px);
      width:calc(100% - 28px); max-width:452px; z-index:50;
      background:var(--card); border-radius:28px; padding:9px 0;
      display:flex; justify-content:space-around; align-items:center;
      box-shadow:0 8px 30px rgba(138,180,255,.22); backdrop-filter:blur(16px);
    }
    .tabbar .tab{flex:1; text-align:center; padding:5px 0; color:var(--sub); font-size:11px; border:none; background:transparent;}
    .tabbar .tab .ico{font-size:22px; display:block; margin-bottom:2px;}
    .tabbar .tab.on{color:var(--blue); font-weight:700;}
    .tabbar .add-btn{
      width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-d)); color:#fff; border:none;
      display:flex; align-items:center; justify-content:center; font-size:28px; margin-top:-24px;
      box-shadow:0 6px 18px rgba(138,180,255,.5);
    }

    /* sheet 记一笔 */
    .sheet-mask{position:fixed; inset:0; background:rgba(80,70,120,.4); z-index:60; display:none; align-items:flex-end; justify-content:center;}
    .sheet-mask.show{display:flex;}
    .sheet{
      background:linear-gradient(180deg,#fdfcff,#fff); width:100%; max-width:480px; max-height:88vh; overflow:auto;
      border-radius:32px 32px 0 0; padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);
      animation:up .28s ease;
    }
    @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .sheet .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
    .sheet .top h3{margin:0; font-size:18px;}
    .sheet .top .close{width:32px;height:32px;border-radius:50%;border:none;background:#f2f4f8;color:var(--text);font-size:18px;}
    .type-tabs{display:flex; background:#f2f4f8; border-radius:14px; padding:4px; margin-bottom:18px;}
    .type-tabs button{flex:1; border:none; background:transparent; padding:10px; border-radius:12px; font-size:15px; font-weight:700; color:var(--sub);}
    .type-tabs button.on.in{background:#e8f6ee; color:var(--in);}
    .type-tabs button.on.out{background:#fdeaea; color:var(--out);}
    .amt-field{text-align:center; margin-bottom:18px;}
    .amt-field .prefix{font-size:18px; color:var(--sub); vertical-align:top;}
    .amt-field input{border:none; background:transparent; font-size:48px; font-weight:800; width:70%; text-align:center; color:var(--text); outline:none;}
    .amt-field input::placeholder{color:#d1d5db;}
    .cat-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px;}
    .cat-grid .cat{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
    .cat-grid .cat .emoji{width:52px;height:52px;border-radius:16px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid transparent;}
    .cat-grid .cat.on .emoji{border-color:var(--blue); background:#eef3ff;}
    .cat-grid .cat span{font-size:12px; color:var(--sub);}

    /* 分类管理面板 */
    .cat-mgr-mask{position:fixed; inset:0; background:rgba(80,70,120,.4); z-index:62; display:none; align-items:flex-end; justify-content:center;}
    .cat-mgr-mask.show{display:flex;}
    .cat-mgr{
      background:#fff; width:100%; max-width:480px; max-height:84vh; overflow:auto;
      border-radius:32px 32px 0 0; padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);
      animation:up .28s ease;
    }
    .cat-mgr .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
    .cat-mgr .top h3{margin:0; font-size:18px;}
    .cat-mgr .top .close{width:32px;height:32px;border-radius:50%;border:none;background:#f2f0f7;color:var(--text);font-size:18px;}
    .cat-mgr-tabs{display:flex; gap:8px; margin-bottom:16px;}
    .cat-mgr-tabs button{flex:1; border:none; background:#f3f0f8; padding:10px; border-radius:14px; font-size:15px; font-weight:700; color:var(--sub);}
    .cat-mgr-tabs button.on{background:#eef3ff; color:var(--blue);}
    .cat-mgr-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
    .cat-mgr-item{display:flex; align-items:center; gap:12px; background:#faf8ff; border-radius:16px; padding:12px 14px;}
    .cat-mgr-item .e{font-size:24px; width:34px; text-align:center;}
    .cat-mgr-item .n{flex:1; font-size:15px; font-weight:600;}
    .cat-mgr-item .ops{display:flex; gap:6px;}
    .cat-mgr-item .ops button{border:none; background:#fff; border-radius:10px; width:38px; height:34px; font-size:16px; box-shadow:0 2px 6px rgba(0,0,0,.05);}
    .cat-mgr-add{width:100%; background:linear-gradient(135deg,var(--blue),var(--blue-d)); color:#fff; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:700;}

    /* emoji 选择器 */
    .emoji-mask{position:fixed; inset:0; background:rgba(80,70,120,.4); z-index:64; display:none; align-items:center; justify-content:center; padding:24px;}
    .emoji-mask.show{display:flex;}
    .emoji-picker{background:#fff; width:100%; max-width:420px; border-radius:24px; padding:18px; max-height:70vh; overflow:auto;}
    .emoji-picker .grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:10px;}
    .emoji-pick{font-size:26px; text-align:center; padding:8px 0; border-radius:12px; cursor:pointer; background:#faf8ff;}
    .emoji-pick:active{background:#eef3ff;}
    .field-line{margin-bottom:14px;}
    .field-line label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;}
    .field-line input, .field-line select{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:12px;font-size:15px;background:#fafbfc;}
    .save-btn{width:100%;background:var(--text);color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:700;margin-top:6px;}

    /* 空态 */
    .empty{text-align:center;color:#fff; padding:70px 20px; font-size:14px; opacity:.85; text-shadow:0 1px 3px rgba(0,0,0,.2);}

    /* 导出/备份按钮 */
    .action-btn{width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.5); font-size:15px; font-weight:600; margin-bottom:10px; color:var(--text);}
    .action-btn.primary{background:var(--text); color:#fff; border-color:var(--text);}
    .action-btn.danger{color:var(--out); border-color:rgba(239,68,68,.25);}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="left">
        <div class="skin-title">📸 我的皮肤</div>
        <div class="skin-sub" id="topSub">今天 2026-07-30 · 共记账 0 笔</div>
      </div>
      <div class="avatar" id="avatar"><img src="" alt=""></div>
    </div>

    <!-- 首页 -->
    <div class="view active" id="viewHome">
      <div class="home-card">
        <div class="bal-row">
          <div>
            <div class="bal-label">本月结余</div>
            <div class="bal-num" id="homeBal">¥0.00</div>
          </div>
          <div class="count">累计记账<br><b id="homeCount">0 笔</b></div>
        </div>
        <div class="io-row">
          <div class="io-box"><div class="k">本月收入</div><div class="v in" id="homeIn">¥0.00</div></div>
          <div class="io-box"><div class="k">本月支出</div><div class="v out" id="homeOut">¥0.00</div></div>
        </div>
      </div>
      <div class="sec-title"><span>最近流水</span><span class="more" id="toDetail">查看全部 ›</span></div>
      <div id="homeList"></div>
    </div>

    <!-- 明细 -->
    <div class="view" id="viewDetail">
      <div class="sec-title"><span>账单明细</span></div>
      <div id="detailList"></div>
    </div>

    <!-- 统计 -->
    <div class="view" id="viewStats">
      <div class="stat-head"><button id="prevMonth">‹</button><span id="statMonth">2026-07</span><button id="nextMonth">›</button></div>
      <div class="stat-cards">
        <div class="sc in"><div class="k">收入</div><div class="v" id="statIn">¥0</div></div>
        <div class="sc out"><div class="k">支出</div><div class="v" id="statOut">¥0</div></div>
        <div class="sc"><div class="k">结余</div><div class="v" id="statBal">¥0</div></div>
      </div>
      <div class="chart-card"><h4>收支趋势（每日）</h4><canvas id="barChart"></canvas></div>
      <div class="chart-card"><h4>支出分类占比</h4><canvas id="pieChart"></canvas></div>
    </div>

    <!-- 我的 -->
    <div class="view" id="viewMine">
      <div class="mine-card">
        <h4>皮肤主题</h4>
        <div class="theme-row" id="themeRow"></div>
      </div>
      <div class="mine-card">
        <h4>分类管理</h4>
        <button class="action-btn" id="catMgrBtn">✏️ 自定义收支分类</button>
      </div>
      <div class="mine-card">
        <h4>个性化背景</h4>
        <div class="upload-row">
          <label><input type="file" id="uploadAvatar" accept="image/*">📷 上传头像</label>
          <label><input type="file" id="uploadWall" accept="image/*">🖼 上传壁纸</label>
        </div>
        <img class="preview-img" id="wallPreview" alt="壁纸预览">
      </div>
      <div class="mine-card">
        <h4>数据管理</h4>
        <button class="action-btn" id="exportExcel">导出 Excel 对账单</button>
        <button class="action-btn" id="backupBtn">导出备份(JSON)</button>
        <button class="action-btn" id="restoreBtn">导入备份</button>
        <input type="file" id="restoreFile" accept="application/json" style="display:none">
        <button class="action-btn" id="sampleBtn">加载示例数据</button>
        <button class="action-btn danger" id="clearBtn">清空全部数据</button>
      </div>
    </div>

    <!-- 底部 Tab -->
    <div class="tabbar">
      <button class="tab on" data-view="home"><span class="ico">🏠</span>首页</button>
      <button class="tab" data-view="detail"><span class="ico">📝</span>明细</button>
      <button class="add-btn" id="addBtn">＋</button>
      <button class="tab" data-view="stats"><span class="ico">📊</span>统计</button>
      <button class="tab" data-view="mine"><span class="ico">👤</span>我的</button>
    </div>
  </div>

  <!-- 记一笔 sheet -->
  <div class="sheet-mask" id="sheetMask">
    <div class="sheet">
      <div class="top"><h3>记一笔</h3><button class="close" id="closeSheet">✕</button></div>
      <div class="type-tabs" id="typeTabs">
        <button data-v="out" class="out">支出</button>
        <button data-v="in" class="in">收入</button>
      </div>
      <div class="amt-field"><span class="prefix">¥</span><input type="number" inputmode="decimal" id="fAmt" placeholder="0.00"></div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="field-line"><label>日期</label><input type="date" id="fDate"></div>
      <div class="field-line"><label>备注</label><input type="text" id="fNote" placeholder="如：打车 / 货款"></div>
      <button class="save-btn" id="saveBtn">保存</button>
    </div>
  </div>

  <!-- 分类管理面板 -->
  <div class="cat-mgr-mask" id="catMgrMask">
    <div class="cat-mgr">
      <div class="top"><h3>分类管理</h3><button class="close" id="closeCatMgr">✕</button></div>
      <div class="cat-mgr-tabs" id="catMgrTabs">
        <button data-v="out" class="out">支出分类</button>
        <button data-v="in" class="in">收入分类</button>
      </div>
      <div class="cat-mgr-list" id="catMgrList"></div>
      <button class="cat-mgr-add" id="addCatBtn">＋ 新增分类</button>
    </div>
  </div>

  <!-- emoji 选择器 -->
  <div class="emoji-mask" id="emojiPickerMask">
    <div class="emoji-picker">
      <div style="font-size:14px;font-weight:700;color:var(--sub);">选一个可爱图标</div>
      <div class="grid" id="emojiPicker"></div>
    </div>
  </div>

  <script src="xlsx-export.js"></script>
  <script src="app.js"></script>
</body>
</html>
